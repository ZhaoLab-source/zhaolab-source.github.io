<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous">
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var el = document.getElementById('lab-views-carousel');
  if (!el || !window.bootstrap || !bootstrap.Carousel) return;
  var existing = bootstrap.Carousel.getInstance(el);
  if (existing && existing.dispose) existing.dispose();

  var instance = new bootstrap.Carousel(el, {
    interval: false,
    ride: false,
    touch: true,
    wrap: true,
    keyboard: true,
    pause: 'hover'
  });

  var prevBtn = el.querySelector('.carousel-control-prev');
  var nextBtn = el.querySelector('.carousel-control-next');
  if (prevBtn) prevBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); instance.prev(); });
  if (nextBtn) nextBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); instance.next(); });
});
</script>
